[package]
name = "wave-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "wave_core"
crate-type = ["cdylib"]

[dependencies]
# PyO3 para Python bindings
pyo3 = { version = "0.20", features = ["extension-module"] }

# MQTT client asíncrono
rumqttc = "0.24"
tokio = { version = "1.0", features = ["full"] }

# Serialización JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

# Utilidades
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }

[dependencies.pyo3-asyncio]
version = "0.20"
features = ["tokio-runtime"]